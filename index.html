<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D32F82">
<title>Jasa Titip Belanja</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --pink:#F44D92; --pink-d:#D32F82; --pink-soft:#FFE3EF; --teal:#0BBDB6; --teal-d:#078A85; --teal-soft:#D9F4F2; --ink:#0E3B43; --bg:#FFF8FB; --line:#F3D5E3; --side:#0E3B43; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button, label, a { touch-action:manipulation; }
  body { margin:0; font:16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); padding:0 16px; }
  .wrap { max-width:1040px; margin:0 auto; }
  #shop { padding-bottom:calc(104px + env(safe-area-inset-bottom)); } /* ruang untuk tombol keranjang */
  [hidden] { display:none !important; }
  h3 { font-family:"Plus Jakarta Sans",sans-serif; }
  /* kepala ringkas: logo di samping judul, supaya barang cepat terlihat */
  .head { display:flex; align-items:center; gap:14px; margin:0 -16px; padding:14px 16px; background:linear-gradient(180deg,var(--pink-soft),var(--bg)); }
  .head img { height:64px; width:64px; flex:none; padding:3px; border-radius:50%; background:#fff; box-shadow:0 4px 14px #F44D9230; }
  .head p { margin:2px 0 0; font-size:.85rem; font-weight:600; color:var(--teal-d); }
  .notice { background:var(--teal-soft); color:var(--teal-d); border-radius:14px; padding:12px 14px; text-align:center; font-weight:700; margin:8px 0 12px; }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; } /* pencarian tetap terlihat saat menggulir */
  .tools { display:flex; align-items:center; gap:8px; }
  #fcats { display:flex; flex-wrap:wrap; gap:8px; padding-top:10px; }
  #fcats[hidden] { display:none; }
  .chip { position:relative; padding:8px 16px; border-radius:99px; background:#fff; border:1.5px solid var(--line); font-weight:600; cursor:pointer; transition:background .2s,color .2s,border-color .2s; }
  .chip input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .chip:has(input:checked) { background:var(--pink-d); border-color:var(--pink-d); color:#fff; }
  .chip:has(input:focus-visible) { outline:2px solid var(--pink-d); outline-offset:2px; }
  .search { flex:1; display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:0 18px; color:var(--pink-d); box-shadow:0 2px 10px #0E3B430D; }
  .search:focus-within { border-color:var(--pink); box-shadow:0 0 0 4px #F44D9222; }
  .search input { flex:1; min-width:0; padding:14px 0; font:inherit; font-weight:500; color:var(--ink); border:0; outline:0; background:none; }
  .ibtn { position:relative; width:52px; flex:none; background:#fff; border:1.5px solid var(--line); border-radius:99px; color:var(--ink); display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 10px #0E3B430D; }
  .ibtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .badge { position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; border-radius:99px; background:var(--pink-d); color:#fff; font-size:.8rem; font-weight:700; display:grid; place-items:center; border:2px solid var(--bg); }
  .seg { --i:1; position:relative; display:flex; padding:4px; gap:2px; background:var(--pink-soft); border-radius:99px; }
  .seg::before { content:""; position:absolute; top:4px; left:4px; width:38px; height:38px; border-radius:99px; background:var(--pink-d); box-shadow:0 2px 8px #D32F8250; transform:translateX(calc(var(--i) * 40px)); transition:transform .3s cubic-bezier(.4,0,.2,1); }
  .seg .ibtn { width:38px; height:38px; border:0; background:none; box-shadow:none; font:inherit; font-weight:700; transition:color .3s; }
  .seg .ibtn.on { color:#fff; }
  .grid { --cols:2; display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:18px; margin-top:6px; }
  .card { position:relative; background:#fff; border-radius:18px; padding:8px 8px 12px; display:flex; flex-direction:column; border:1px solid var(--line); box-shadow:0 2px 10px #0E3B430D; min-width:0; transition:transform .15s,box-shadow .15s; }
  @media (hover:hover) { .card:hover { transform:translateY(-3px); box-shadow:0 10px 26px #0E3B4320; } }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; margin-bottom:10px; }
  .tagp { position:absolute; top:16px; left:16px; z-index:1; padding:4px 11px; border-radius:99px; font-size:.75rem; font-weight:800; color:#fff; box-shadow:0 2px 8px #0003; }
  .tagp.new { background:var(--teal-d); }
  .tagp.hot { background:#E23B2E; }
  .tagp.flash { background:#FFD23F; color:var(--ink); }
  .nopic { aspect-ratio:1; border-radius:14px; margin-bottom:10px; background:linear-gradient(135deg,var(--pink-soft),var(--teal-soft)); display:grid; place-items:center; font-size:3rem; }
  .card h3, .card .sub, .card .price, .card .stock, .card .act { margin-left:6px; margin-right:6px; }
  .card h3 { overflow-wrap:anywhere; margin-top:0; margin-bottom:2px; font-weight:700; font-size:1rem; line-height:1.3; }
  .sub { font-size:.85rem; font-weight:400; opacity:.7; }
  .price { font-weight:800; font-size:1.2rem; margin-top:8px; margin-bottom:2px; color:var(--pink-d); }
  .stock { display:inline-block; align-self:flex-start; font-size:.75rem; font-weight:700; padding:2px 10px; border-radius:99px; background:var(--teal-soft); color:var(--teal-d); }
  .act { display:flex; margin-top:auto; padding-top:12px; }
  .step { flex:1; display:flex; align-items:center; justify-content:space-between; background:var(--pink-soft); border-radius:99px; padding:3px; }
  .step b { font-size:1.1rem; }
  .step button:disabled { opacity:.35; cursor:not-allowed; }
  .step button { width:42px; height:42px; border-radius:50%; border:0; background:#fff; color:var(--pink-d); font:inherit; font-size:1.25rem; font-weight:700; cursor:pointer; box-shadow:0 1px 4px #0E3B4322; }
  .cartbtn { flex:1; height:46px; border:1.5px solid var(--pink-d); border-radius:99px; background:#fff; color:var(--pink-d); display:flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; cursor:pointer; }
  .cartbtn:not(:disabled):active { background:var(--pink-d); color:#fff; }
  .cartbtn:disabled { border-color:transparent; background:#EFE6EA; color:#7A6A72; cursor:not-allowed; }
  .cartbtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #pager { text-align:center; margin:20px 0 0; font-weight:700; opacity:.6; }
  .empty { padding:24px; text-align:center; grid-column:1/-1; }
  #fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); width:min(440px,calc(100% - 24px)); padding:15px; border:0; border-radius:99px; background:linear-gradient(90deg,var(--pink-d),var(--pink)); color:#fff; font:inherit; font-size:1rem; font-weight:700; box-shadow:0 8px 24px #D32F8260; cursor:pointer; }
  #fab { display:flex; align-items:center; gap:12px; padding:8px 8px 8px 8px; text-align:left; }
  #fab .tot { margin-left:auto; padding:0 14px; font-size:1.05rem; white-space:nowrap; }
  #fab:not(.empty) .eic { background:#ffffff2e; color:#fff; box-shadow:none; position:relative; }
  #fab .n { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 4px; box-sizing:border-box; border-radius:99px; background:#fff; color:var(--pink-d); font-size:.75rem; display:grid; place-items:center; }
  #fab.empty { padding-right:20px; background:var(--pink-soft); color:var(--ink); border:1.5px solid #fff; box-shadow:0 6px 20px #0E3B431F; }
  #fab .eic { flex:none; width:44px; height:44px; border-radius:50%; background:#fff; color:var(--pink-d); display:grid; place-items:center; box-shadow:0 2px 8px #D32F8230; }
  #fab .eic svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #fab .et { display:flex; flex-direction:column; line-height:1.25; }
  #fab .et small { font-weight:500; opacity:.65; font-size:.8rem; }
  dialog { width:min(520px,94vw); border:0; border-radius:24px; padding:20px; background:var(--bg); color:var(--ink); font-family:inherit; }
  dialog::backdrop { background:#0E3B4399; }
  dialog h2 { margin-top:0; font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; }
  /* halaman keranjang (TOK-15..20) */
  #back { display:inline-block; padding:16px 0 4px; color:var(--pink-d); font-weight:700; text-decoration:none; }
  #cartpage h2 { margin:0 0 4px; font-weight:800; font-size:1.5rem; }
  #cempty { text-align:center; padding:40px 0; }
  .crow { display:grid; grid-template-columns:84px 1fr; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  .crow img, .crow .nopic { width:84px; height:84px; margin:0; border-radius:14px; object-fit:cover; font-size:2rem; }
  .crow h3 { margin:0; font-size:1rem; line-height:1.3; overflow-wrap:anywhere; }
  .crow .cline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
  .cact .step { width:128px; }
  .cust { padding-top:6px; }
  .cust h3 { margin:14px 0 0; }
  .cbar { position:sticky; bottom:0; margin:12px -16px 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -6px 18px #0E3B430F; }
  .cbar small { display:block; font-weight:500; font-size:.8rem; opacity:.7; }
  .cbar .total { padding:0 0 10px; align-items:flex-start; }
  .cbar .cnote { margin-top:8px; text-align:center; }
  .total { display:flex; justify-content:space-between; font-weight:800; padding:14px 0; }
  .send, .done { display:block; width:100%; text-align:center; padding:15px; border:0; border-radius:99px; background:var(--pink-d); color:#fff; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
  .cust label { display:block; margin-top:8px; font-size:.85rem; font-weight:700; }
  .cust input { width:100%; margin-top:4px; padding:12px; font:inherit; font-weight:500; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:12px; }
  #cerr { min-height:1.3em; margin:6px 0; color:#c00; font-size:.9rem; font-weight:600; }
  .close { width:100%; margin-top:8px; padding:12px; border:0; background:none; font:inherit; color:var(--ink); cursor:pointer; }
  label.chk { display:flex; font-weight:500; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  label.chk input { width:22px; height:22px; accent-color:var(--pink-d); }
  /* layar HP */
  @media (max-width:600px) {
    body { padding-left:12px; padding-right:12px; }
    .head { margin:0 -12px; padding:12px; }
    [data-cols="3"] { display:none; } /* 3 kolom terlalu sempit di HP */
    .grid { gap:12px; }
    .cbar { margin-left:-12px; margin-right:-12px; padding-left:12px; padding-right:12px; }
    /* jendela keranjang muncul dari bawah, mudah dijangkau ibu jari */
    dialog { margin:auto 0 0; width:100%; max-width:100%; max-height:88vh; overflow:auto; border-radius:24px 24px 0 0; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="wrap" id="shop">
  <div class="head">
    <img src="/assets/logo.png" alt="Jasa Titip Belanja">
    <div><p>We make shopping easy</p></div>
  </div>
  <div class="notice" id="notice" hidden></div>

  <div class="bar">
  <div class="tools">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Cari nama barang">
    </label>
    <div class="seg">
      <button class="ibtn" data-cols="1" aria-label="1 kolom">1</button>
      <button class="ibtn on" data-cols="2" aria-label="2 kolom">2</button>
      <button class="ibtn" data-cols="3" aria-label="3 kolom">3</button>
    </div>
    <button class="ibtn" id="fbtn" aria-label="Filter kategori">
      <svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
      <span class="badge" id="fbadge" hidden></span>
    </button>
  </div>
  <div id="fcats" hidden></div>
  </div>

  <main class="grid" id="grid"></main>
  <nav id="pager" hidden></nav>
</div>
<button id="fab"></button>

<section class="wrap" id="cartpage" hidden>
  <a id="back" href="#">← Lanjut belanja</a>
  <h2>Keranjang Belanja</h2>
  <div id="cempty" hidden><p>Keranjang masih kosong 🛍️</p><a class="send" href="#">Mulai belanja</a></div>
  <div id="cfull" hidden>
    <div id="items"></div>
    <div class="cust">
      <h3>Data penerima</h3>
      <label>Nama penerima<input id="cname" autocomplete="name"></label>
      <label>Nomor HP (WhatsApp)<input id="cphone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08123456789"></label>
      <div id="cerr" role="alert"></div>
    </div>
    <div class="cbar">
      <div class="total"><span>Total (belum termasuk ongkir)<small id="ccount"></small></span><span id="total"></span></div>
      <a class="send" id="send" target="_blank" rel="noopener">Pesan via WhatsApp</a>
      <small class="cnote">Ongkir dan kurir ditentukan admin lewat WhatsApp.</small>
    </div>
  </div>
</section>

<script>
let WA = "", PRODUCTS = []; // diisi dari /api/data (diatur lewat halaman /admin)
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const $ = id => document.getElementById(id);
const BADGES = { new: "New Stock", hot: "🔥 Hot Item", flash: "⚡ Flash Sale" }; // diatur admin per barang
const rp = n => "Rp" + n.toLocaleString("id-ID");
const CART = `<svg viewBox="0 0 24 24"><path d="M2 3h3l2.5 12h11L21 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>`;
const PER = 12;                   // barang yang dimuat setiap kali menggulir ke bawah
let page = 1;
// PSM-1: kode pesanan baru setiap halaman dimuat; pesan WhatsApp memuat kode ini, server menyimpan isi keranjangnya
const CODE = "PSN-" + [...crypto.getRandomValues(new Uint8Array(6))].map(n => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[n % 32]).join("");
const sel = new Set();             // kategori terpilih
let cart = {};                    // cart: {id: jumlah}
try { cart = JSON.parse(localStorage.cart || "{}"); } catch {}

const max = p => p.stock ?? Infinity;
// belum di keranjang: tombol "Tambah"; sudah: − jumlah + (di jumlah 1 tombol − menjadi 🗑 = batalkan barang)
const actHtml = p => {
  const id = esc(p.id), n = cart[p.id] || 0;
  if (max(p) < 1) return `<button class="cartbtn" disabled>Stok habis</button>`;
  if (!n) return `<button class="cartbtn" data-buy="${id}" aria-label="Tambah ke keranjang">${CART} Tambah</button>`;
  return `<div class="step"><button data-dec="${id}" aria-label="${n === 1 ? "Hapus dari keranjang" : "Kurangi"}">${n === 1 ? "🗑" : "−"}</button><b>${n}</b><button data-inc="${id}" aria-label="Tambah" ${n >= max(p) ? "disabled" : ""}>+</button></div>`;
};
const setCols = n => {
  $("grid").style.setProperty("--cols", n);
  document.querySelector(".seg").style.setProperty("--i", n - 1);
  document.querySelectorAll("[data-cols]").forEach(x => x.classList.toggle("on", x.dataset.cols == n));
};
if (innerWidth > 900) setCols(3); // layar lebar: 3 kolom supaya kartu tidak raksasa
const cats = () => [...new Set(PRODUCTS.map(p => p.cat).filter(Boolean))];

// daftar bertambah sendiri ke bawah saat penanda di dasar daftar hampir terlihat
function autoMore() {
  const el = $("pager");
  if (!$("shop").hidden && !el.hidden && el.getBoundingClientRect().top < innerHeight + 300) { page++; renderGrid(); }
}
addEventListener("scroll", autoMore, { passive: true });

function renderGrid() {
  const q = $("q").value.toLowerCase();
  const list = PRODUCTS.filter(p => (!sel.size || sel.has(p.cat)) && (p.name + " " + p.desc).toLowerCase().includes(q));
  const pages = Math.max(1, Math.ceil(list.length / PER));
  page = Math.min(page, pages);
  $("pager").hidden = page >= pages; $("pager").textContent = "Memuat barang lainnya…";
  requestAnimationFrame(autoMore); // layar tinggi: lanjut memuat sampai layar penuh
  $("grid").innerHTML = list.slice(0, page * PER).map(p => `
    <div class="card">
      ${BADGES[p.badge] ? `<span class="tagp ${p.badge}">${BADGES[p.badge]}</span>` : ""}
      ${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" decoding="async">` : `<div class="nopic">🛍️</div>`}
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(p.desc || p.cat)}</div>
      <div class="price">${rp(p.price)}</div>
      ${p.stock == null ? "" : `<div class="stock">${p.stock > 0 ? `Sisa ${p.stock}` : "Stok habis"}</div>`}
      <div class="act" data-id="${esc(p.id)}">${actHtml(p)}</div>
    </div>`).join("") || `<p class="empty">Barang tidak ditemukan 🙏<br>Chat kami, mungkin bisa kami carikan!</p>`;
}

function renderFilter() {
  $("fcats").innerHTML = cats().map(c => `<label class="chip"><input type="checkbox" data-c="${esc(c)}" ${sel.has(c) ? "checked" : ""}>${esc(c)}</label>`).join("");
  $("fbadge").hidden = !sel.size; $("fbadge").textContent = sel.size;
}

function renderCart() {
  try { localStorage.cart = JSON.stringify(cart); } catch {}
  for (const id in cart) { // buang barang yang sudah dihapus admin / batasi sesuai stok
    const p = PRODUCTS.find(p => p.id === id);
    if (!p || max(p) < 1) delete cart[id]; else cart[id] = Math.min(cart[id], max(p));
  }
  const rows = PRODUCTS.filter(p => cart[p.id]);
  const count = rows.reduce((s, p) => s + cart[p.id], 0);
  const total = rows.reduce((s, p) => s + cart[p.id] * p.price, 0);
  $("fab").classList.toggle("empty", !count);
  const cartIc = `<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6"/></svg>`;
  $("fab").innerHTML = count
    ? `<span class="eic">${cartIc}<span class="n">${count}</span></span><span class="et">Lihat Keranjang<small>Belum termasuk ongkir</small></span><b class="tot">${rp(total)}</b>`
    : `<span class="eic">${cartIc}</span><span class="et">Keranjang masih kosong<small>Ketuk + pada barang untuk mulai belanja</small></span>`;
  $("items").innerHTML = rows.map(p => `
    <div class="crow">
      ${p.img ? `<img src="${esc(p.img)}" alt="">` : `<div class="nopic">🛍️</div>`}
      <div>
        <h3>${esc(p.name)}</h3>
        <div class="sub">${esc(p.desc || p.cat)}</div>
        <div class="sub">${rp(p.price)}${p.stock == null ? "" : ` · Sisa ${p.stock}`}</div>
        <div class="cline"><div class="cact">${actHtml(p)}</div><b>${rp(cart[p.id] * p.price)}</b></div>
      </div>
    </div>`).join("");
  $("cfull").hidden = !count; $("cempty").hidden = !!count; // TOK-19; sebelum katalog dimuat keduanya tersembunyi
  $("ccount").textContent = `${count} barang`;
  $("total").textContent = rp(total);
  const msg = "Halo, saya mau pesan:\n" + rows.map(p => `- ${p.name} x${cart[p.id]} = ${rp(cart[p.id] * p.price)}`).join("\n")
    + `\n\nTotal: ${rp(total)}\nKode pesanan: ${CODE}\n\nNama: ${$("cname").value.trim()}\nHP: ${phone08($("cphone").value)}\nAlamat:`;
  $("send").href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  document.querySelectorAll(".act[data-id]").forEach(el => { const p = PRODUCTS.find(p => p.id === el.dataset.id); if (p) el.innerHTML = actHtml(p); });
}

// PSM-10: nama dan HP pelanggan, diingat di browser; HP dinormalisasi seperti di server (+62…, 62…, 8… -> 08…)
const phone08 = v => { let d = String(v).replace(/\D/g, ""); if (d.startsWith("62")) d = "0" + d.slice(2); else if (d.startsWith("8")) d = "0" + d; return d; };
try { const c = JSON.parse(localStorage.cust || "{}"); $("cname").value = c.name || ""; $("cphone").value = c.phone || ""; } catch {}
for (const id of ["cname", "cphone"]) $(id).oninput = () => {
  try { localStorage.cust = JSON.stringify({ name: $("cname").value, phone: $("cphone").value }); } catch {}
  $("cerr").textContent = ""; renderCart();
};
// PSM-1: catat pesanan ke server; gagal pun WhatsApp tetap terbuka (tautan tidak dihentikan)
$("send").addEventListener("click", e => {
  const name = $("cname").value.trim(), phone = phone08($("cphone").value);
  const bad = !name ? ["Nama penerima wajib diisi.", "cname"] : !/^08\d{8,12}$/.test(phone) ? ["Nomor HP harus nomor HP Indonesia (diawali 08).", "cphone"] : null;
  if (bad) { e.preventDefault(); $("cerr").textContent = bad[0]; return $(bad[1]).focus(); }
  fetch("/api/inbox", { method: "POST", keepalive: true, headers: { "content-type": "application/json" },
    body: JSON.stringify({ code: CODE, name, phone, items: Object.entries(cart).map(([id, qty]) => ({ id, qty })) }) }).catch(() => {});
});

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset, p = PRODUCTS.find(p => p.id === (d.buy || d.inc || d.dec));
  if (d.buy) { cart[p.id] = Math.min(max(p), (cart[p.id] || 0) + 1); renderCart(); }
  if (d.inc) { cart[p.id] = Math.min(max(p), cart[p.id] + 1); renderCart(); }
  if (d.dec) { if (--cart[p.id] <= 0) delete cart[p.id]; renderCart(); }
  if (d.cols) setCols(d.cols);
});
$("fcats").onchange = e => { e.target.checked ? sel.add(e.target.dataset.c) : sel.delete(e.target.dataset.c); page = 1; renderFilter(); renderGrid(); };
$("fbtn").onclick = () => { $("fcats").hidden = !$("fcats").hidden; };
$("q").oninput = () => { page = 1; renderGrid(); };
// TOK-15: keranjang = halaman sendiri di #keranjang (tetap satu berkas; tombol Kembali di browser/HP berfungsi)
let shopY = 0; // posisi gulir katalog, dipulihkan saat kembali
const route = () => {
  const on = location.hash === "#keranjang";
  $("shop").hidden = $("fab").hidden = on; $("cartpage").hidden = !on;
  scrollTo(0, on ? 0 : shopY);
};
addEventListener("hashchange", route);
$("fab").onclick = () => { shopY = scrollY; location.hash = "keranjang"; };
route();

fetch("/api/data").then(r => r.json()).then(d => {
  ({ wa: WA, products: PRODUCTS } = d);
  if (d.notice) { $("notice").textContent = d.notice; $("notice").hidden = false; }
  renderFilter(); renderGrid(); renderCart();
}).catch(() => { $("grid").innerHTML = `<p class="empty">Gagal memuat katalog. Coba lagi nanti 🙏</p>`; });
</script>
</body>
</html>
